# Shared Cloud Build config for the workflow-agent job images
# (quality_agent, skill_evolution_agent). Exists so SDK_REPO/SDK_BRANCH flow
# from .env into the Docker build as build args — `gcloud builds submit
# --tag` cannot pass build args. Invoked by each agent's deploy.sh:
#
#   gcloud builds submit --config scripts/deploy/cloudbuild_job.yaml \
#     --substitutions=_IMAGE=<image>,_SDK_REPO=$SDK_REPO,_SDK_BRANCH=$SDK_BRANCH .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '--build-arg'
      - 'SDK_REPO=${_SDK_REPO}'
      - '--build-arg'
      - 'SDK_BRANCH=${_SDK_BRANCH}'
      - '.'
images:
  - '${_IMAGE}'

# Argus hourly sweep — catch-all behind claude-pr-review.yml.
#
# If an event-triggered run failed or was missed, this pass picks the
# item up within the hour. It finds open PRs/issues with unanswered
# activity in the last 24h and applies the same CLAUDE.md review
# standards. An idle hour still starts a short claude-opus-5 session
# (a few gh list calls, then exit) — 24 of them a day; lower the cron
# frequency if that cost matters.
#
# NOTE: GitHub suspends cron schedules after ~60 days without repo
# activity; re-enable under Actions if the repo has been dormant.
#
# Auth is identical to claude-pr-review.yml (reviewer app + Vertex WIF).

name: Argus Hourly Sweep

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# One sweep at a time; a queued sweep covers the same window anyway.
concurrency:
  group: argus-hourly-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep Unanswered PRs/Issues
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # WIF OIDC (Vertex)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint reviewer app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Sweep for unanswered items
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_vertex: "true"
          prompt: |
            You are the catch-all sweep behind the event-triggered Argus
            reviewer in ${{ github.repository }}. Work with `gh`:

            1. List open PRs and open issues updated in the last 24
               hours (`gh pr list` / `gh issue list` with --json
               including number, updatedAt, author, labels). The wide
               window is deliberate — cron runs get delayed or dropped;
               the rules below make re-processing a no-op.
            2. For each, read the timeline and DROP it when any of:
               - Argus (the literal login "evekhm-odyssey-argus[bot]")
                 already commented AFTER the latest non-Argus activity
                 (for PRs: after the latest push);
               - the only activity in the window is Argus's own
                 comments;
               - it is an issue labeled "quality" (machine-filed for
                 the evolution dispatcher — never touch these).
               Items authored by OTHER bots and machine accounts are
               IN scope: machine-opened skill-evolution/* candidate
               PRs are the main class this sweep exists to catch.
            3. For each remaining item (at most 5 per run — list any
               overflow in the run log, the next sweep gets them):
               - PR: review the diff (`gh pr diff`, `gh pr view`) and
                 post ONE review comment following the "Automated
                 review standards" section of CLAUDE.md exactly:
                 summary, bugs/edge cases, security concerns, at most
                 3 significant suggestions. Comment only — never
                 approve, merge, or close.
               - Issue: investigate against the repository code and
                 post ONE comment answering it, citing file paths.
            4. If nothing qualifies, finish without posting anything.
          claude_args: |
            --model claude-opus-5
            --max-turns 50
            --allowedTools "Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.CLAUDE_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: global
          ANTHROPIC_SMALL_FAST_MODEL: claude-opus-5

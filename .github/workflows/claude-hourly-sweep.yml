# Argus hourly sweep — catch-all behind claude-pr-review.yml.
#
# If an event-triggered run failed or was missed, this pass picks the
# item up within the hour. It finds open PRs/issues with unanswered
# activity in the last 24h and applies the same CLAUDE.md review
# standards. An idle hour still starts a short claude-opus-5 session
# (a few gh list calls, then exit) — 24 of them a day; lower the cron
# frequency if that cost matters.
#
# NOTE: GitHub suspends cron schedules after ~60 days without repo
# activity; re-enable under Actions if the repo has been dormant.
#
# Auth is identical to claude-pr-review.yml (reviewer app + Vertex WIF).

name: Argus Hourly Sweep

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# One sweep at a time; a queued sweep covers the same window anyway.
concurrency:
  group: argus-hourly-sweep
  cancel-in-progress: false

env:
  # The reviewer's login, interpolated into the prompt below. Sourced
  # from the repo variable so the bot name is never hardcoded in
  # workflow code — set it once (vars.ARGUS_LOGIN) to rename the bot.
  # This is the app slug: GraphQL output (gh --json) omits the "[bot]"
  # suffix, REST appends it.
  ARGUS_LOGIN: ${{ vars.ARGUS_LOGIN }}

jobs:
  sweep:
    name: Sweep Unanswered PRs/Issues
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write   # WIF OIDC (Vertex)
      actions: write    # dispatch missed PRs to the event pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint reviewer app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      # An unset repo variable interpolates to "", and auth@v2 treats
      # an empty service_account as direct WIF instead of an error —
      # the run would go green here and die at the first Vertex call.
      - name: Fail fast if reviewer variables are unset
        if: vars.ARGUS_SERVICE_ACCOUNT == '' || vars.CLAUDE_VERTEX_PROJECT_ID == '' || vars.ARGUS_LOGIN == ''
        run: |
          echo "::error::Repo variable ARGUS_SERVICE_ACCOUNT, CLAUDE_VERTEX_PROJECT_ID and/or ARGUS_LOGIN is not set (an empty CLAUDE_VERTEX_PROJECT_ID fails only after the tracking comment is posted). Run SETUP_ARGUS=1 bash scripts/setup/setup_github.sh (docs/GITHUB_APP_SETUP.md, 'Reviewer app (Argus)')."
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # Dedicated least-privilege account: the argusVertexPredict
          # custom role (aiplatform.endpoints.predict) and nothing
          # else. Never point this at the shared CI account
          # (github-actions-fixer) — see claude-pr-review.yml.
          service_account: ${{ vars.ARGUS_SERVICE_ACCOUNT }}

      # auth@v2 drops the credential file (live OIDC token + project
      # number) into $GITHUB_WORKSPACE, and allowlisted git commands
      # can read any workspace path (git diff --no-index — Argus PoC
      # on run 30960678094). Move it out before the agent starts; the
      # auth action's post-job cleanup follows GOOGLE_GHA_CREDS_PATH,
      # so deletion still works.
      - name: Move WIF credentials out of the workspace
        run: |
          DEST="$RUNNER_TEMP/gcp-wif-creds.json"
          mv "$GOOGLE_GHA_CREDS_PATH" "$DEST"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$DEST"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$DEST"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$DEST"
          } >> "$GITHUB_ENV"

      # Deterministic self-heal (#109): re-derive consensus labels from
      # each item's ledger. No agent involved — pure jq over recorded
      # state — so it runs before the agent step and costs no model
      # turns. This is what retro-corrects items that closed while a
      # label was stuck (suggestion-only PRs merged at consensus:pending
      # before the label logic learned they need no peer verdict), and
      # it is a no-op when labels are already true. Closed items are
      # deliberately in scope; 30-day window and a 20-item cap bound the
      # API cost.
      - name: Self-heal consensus labels (trusted, deterministic)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          # Both non-terminal labels are in scope (R7-1): a stuck
          # consensus:disputed heals here too — the ledger may already
          # record the concession while the label write was lost. The
          # failure signal is gh's exit status, never a payload
          # sentinel (R6-1): a failing gh can still emit partial
          # stdout, and a sentinel comparison would miss it. search/
          # issues is the endpoint most prone to secondary rate
          # limits; a label cosmetic must never take down the sweep
          # that finds unanswered PRs (R1-4).
          TOTAL=0
          ALLNUMS=""
          for LBL in "consensus:pending" "consensus:disputed"; do
            if ! RESP=$(gh api -X GET --paginate --slurp search/issues \
              -f q="repo:${{ github.repository }} label:\"${LBL}\" updated:>=${SINCE}" \
              -f per_page=100 -f sort=updated -f order=asc); then
              echo "::warning::self-heal search for ${LBL} failed — skipping it this cycle"
              continue
            fi
            TOTAL=$((TOTAL + $(echo "$RESP" | jq -r '.[0].total_count // 0' 2>/dev/null || echo 0)))
            ALLNUMS="${ALLNUMS} $(echo "$RESP" | jq -r '.[].items[].number' 2>/dev/null || true)"
          done
          # Clock-driven cyclic window (R14-1, ending the ordering
          # series R9/R13): a rotating 20-item slice of the stable
          # number-sorted list, offset by the hour. Every item is
          # covered within ceil(N/20) hours regardless of position,
          # and the rotation depends on nothing the processing might
          # or might not touch — the write-on-drift change silenced
          # the updatedAt bumps earlier rotations relied on.
          ORDERED=$(printf '%s\n' $ALLNUMS | awk 'NF && !seen[$0]++' | sort -un)
          N_ALL=$(printf '%s\n' "$ORDERED" | sed '/^$/d' | wc -l)
          if [ "$N_ALL" -le 20 ]; then
            NUMS="$ORDERED"
          else
            PAGES=$(( (N_ALL + 19) / 20 ))
            OFFSET=$(( ( $(date -u +%s) / 3600 ) % PAGES * 20 ))
            NUMS=$({ printf '%s\n' "$ORDERED"; printf '%s\n' "$ORDERED"; } \
              | sed '/^$/d' | tail -n +$((OFFSET + 1)) | head -20)
          fi
          COUNT=0
          for N in $NUMS; do
            case "$N" in (*[!0-9]*|'') continue;; esac
            echo "relabel #$N"
            bash scripts/ci/argus_post_review.sh relabel \
              "${{ github.repository }}" "$N" - || echo "relabel #$N failed (non-fatal)"
            COUNT=$((COUNT + 1))
          done
          # Truncation is loud, same norm as the sweep's other caps
          # (R2-3): legitimately-pending items occupy the cap every
          # hour, so a silently dropped 21st would never re-derive.
          echo "self-heal: ${COUNT} of ${TOTAL} pending item(s) re-derived"
          if [ "${TOTAL}" -gt 20 ]; then
            echo "::warning::self-heal cap hit — $((TOTAL - 20)) item(s) deferred to later sweeps"
          fi

      # The nudge step below runs AFTER the agent, so the script it
      # executes must be staged and hash-pinned now — same discipline
      # as claude-pr-review.yml (the agent's Write tool is not
      # path-restricted; a recorded step output is the one thing it
      # cannot forge).
      - name: Stage trusted posting script
        id: stage
        run: |
          cp scripts/ci/argus_post_review.sh "$RUNNER_TEMP/argus_post_review.sh"
          echo "hash=$(sha256sum "$RUNNER_TEMP/argus_post_review.sh" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Sweep for unanswered items
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_vertex: "true"
          prompt: |
            You are the catch-all sweep behind the event-triggered Argus
            reviewer in ${{ github.repository }}. Work with `gh`:

            1. List open PRs and open issues updated in the last 24
               hours (`gh pr list` / `gh issue list` with --json
               including number, updatedAt, author, labels — ALWAYS
               with `--limit 100`: gh's silent default is 30,
               newest-created first, which would hide an old but
               still-active item). If either list returns exactly 100
               items the cap itself may have truncated coverage — say
               so in your output, same as the 5-item review cap. The
               wide window is deliberate — cron runs get delayed or
               dropped; the rules below make re-processing a no-op.
            2. For each, read
               `gh pr view --json headRefOid,comments,reviews`
               / `gh issue view --json comments` and DROP it when any
               of:
               - PR: a comment OR review by Argus contains the line
                 "Reviewed-head: <oid>" where <oid> equals the PR's
                 current headRefOid (the event-driven job posts PR
                 REVIEWS, not comments — check both). Argus's login is
                 "${{ env.ARGUS_LOGIN }}" — GraphQL output (gh --json)
                 omits the "[bot]" suffix, REST includes it; treat
                 both forms as Argus. A comment WITHOUT a matching
                 marker is not a completed review — a run that died
                 mid-way leaves a markerless tracking comment, and
                 that PR still needs you. Do not compare timestamps
                 (commit dates are not push dates). Human comments
                 alone NEVER trigger a re-review — replies are the
                 @argus mention path's job, not yours (mention
                 replies carry no markers and neither block nor
                 trigger a review);
                 EXCEPTION — unreconciled peer verdict: keep the PR
                 even at a matching Reviewed-head when its ledger has
                 a non-suggestion finding at atlas "pending" and a
                 peer review or peer comment is NEWER than the
                 ledger data's "atlas_seen_at" timestamp (treat a
                 missing atlas_seen_at as never-seen). Compare against
                 atlas_seen_at, never the ledger comment's createdAt:
                 the ledger is PATCHed in place, its createdAt never
                 advances, and that comparison would re-dispatch the
                 same PR every hour forever (R15-1). Put such PRs in "consensus_prs"
                 (step 5), never in "prs": a review dispatch cannot
                 update the ledger's Atlas column, only the consensus
                 path can.
               - PR: it is from a fork (`gh pr view --json
                 isCrossRepository` is true) — the dispatch path
                 refuses forks by design; maintainers review those by
                 commenting @argus themselves;
               - issue: Argus has ever commented on it (follow-ups
                 are the mention path's job);
               - it is machine-filed: labeled "quality", or its content
                 is a quality report or a skill-evolution companion
                 issue — those belong to the evolution dispatcher.
               Items authored by other bots and machine accounts are
               otherwise IN scope: machine-opened skill-evolution/*
               candidate PRs with no review yet are the main class
               this sweep exists to catch.
            3. For each remaining item (at most 5 per run — list any
               overflow in your output, the next sweep gets them):
               - PR: do NOT review it yourself — the event pipeline
                 owns reviews, the ledger, and the labels. Add its
                 number to the dispatch list (step 4); a trusted step
                 dispatches the review workflow for it.
               - Issue: investigate against the repository code and
                 post ONE comment answering it, starting with
                 "### Argus" and ending with the exact signature line
                 "— Argus · Claude on Vertex AI", citing file paths.
                 Number any findings you state with stable IDs
                 R<issue-number>-1, R<issue-number>-2, ... — the peer
                 reconciliation and the findings ledger key on them.
            4. Dead-peer scan (#113) — OPEN PRs only (issues cannot
               reach a pending Atlas verdict). Enumerate candidates
               with `gh pr list --state open --label consensus:pending
               --limit 100` AND a second pass with
               `--label consensus:disputed`, then union the lists —
               the disputed label displaces the pending one on items
               that carry both a disputed and a pending row, so a
               single-label scan misses them (R11-1). Use the union,
               NOT the step-1 window: a PR waiting on a
               dead peer has, by definition, no recent updates, so the
               24h-updated list from step 1 excludes exactly the PRs
               this scan exists to find (R3-2). For each whose
               "Argus findings ledger" comment's embedded JSON has a
               finding with severity NOT "suggestion", outcome NOT
               "escalated", and atlas "pending" OR "dispute" (any
               status except "withdrawn") — a dispute the peer
               abandoned mid-exchange stalls exactly like an
               unanswered verdict (R12-1) — nominate a nudge when ALL
               hold:
               - that finding's pending_since is older than 24 hours
                 (rows written before pending_since existed: use the
                 timestamp of the OLDEST Argus review/comment
                 containing a "Reviewed-head:" marker — ANY oid, so a
                 fresh push cannot restart this clock);
               - a review/comment by Argus carries "Reviewed-head:
                 <oid>" equal to the CURRENT headRefOid — if not, the
                 PR is waiting on an Argus re-review, not on Atlas;
               - no comment in the thread contains "Consensus-nudge:
                 <current headRefOid>" (the dedupe token).
               At most 5 nudges per run; list any overflow in your
               output.
            5. ALWAYS write ${{ runner.temp }}/argus-dispatch.json —
               {"prs": [<numbers to re-review>],
                "consensus_prs": [<numbers with an unreconciled peer
                verdict — the step-2 exception>],
                "nudges": [{"number": <pr>, "sha": "<current headRefOid>"}]}
               — with empty arrays when nothing qualifies. If nothing
               qualifies at all, write the empty lists and finish
               without posting anything.
          claude_args: |
            --model claude-opus-5
            --max-turns 50
            --allowedTools "Write,Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.CLAUDE_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: global
          ANTHROPIC_SMALL_FAST_MODEL: claude-opus-5

      # Trusted dispatch: the agent only nominates PR numbers; this
      # step validates them and triggers the event pipeline with the
      # job's own GITHUB_TOKEN (actions: write). workflow_dispatch is
      # one of the two event types GITHUB_TOKEN is allowed to chain.
      - name: Dispatch missed PRs to the review pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${{ runner.temp }}/argus-dispatch.json"
          if [ ! -f "$F" ]; then echo "no dispatch file"; exit 0; fi
          if ! jq -e '(.prs | type == "array" and length <= 5) and
                      (.prs | all(type == "number"))' "$F" >/dev/null; then
            echo "::error::argus-dispatch.json failed validation"; exit 1
          fi
          for N in $(jq -r '.prs[]' "$F"); do
            echo "dispatching review for PR #$N"
            gh workflow run claude-pr-review.yml \
              --repo "${{ github.repository }}" --ref main \
              -f pr_number="$N"
          done
          if ! jq -e '(.consensus_prs // []) | type == "array" and length <= 5 and all(type == "number")' "$F" >/dev/null; then
            echo "::error::consensus_prs failed validation"; exit 1
          fi
          for N in $(jq -r '(.consensus_prs // [])[]' "$F"); do
            case "$N" in (*[!0-9]*|'') continue;; esac
            echo "dispatching consensus recovery for PR #$N"
            gh workflow run claude-pr-review.yml \
              --repo "${{ github.repository }}" --ref main \
              -f pr_number="$N" -f mode=consensus
          done

      # Dead-peer nudges (#113). Runs after the agent, so the staged
      # hash-pinned script does the posting; the agent only nominates
      # {number, sha} pairs, validated here. Posts with the app token
      # so the comment carries the Argus identity, and the script
      # re-validates the sha before writing. !cancelled(): a failed
      # PR-dispatch validation must not silently drop valid nudges —
      # this step self-validates everything it uses.
      - name: Post dead-peer nudges (trusted step)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          F="${{ runner.temp }}/argus-dispatch.json"
          if [ ! -f "$F" ]; then echo "no dispatch file"; exit 0; fi
          if ! jq -e '(.nudges // []) | type == "array" and length <= 5 and
                      all((.number | type == "number") and
                          (.sha | type == "string" and test("^[0-9a-f]{40}$")))' \
              "$F" >/dev/null; then
            echo "::error::nudges failed validation"; exit 1
          fi
          STAGED="$RUNNER_TEMP/argus_post_review.sh"
          if [ "$(sha256sum "$STAGED" | cut -d' ' -f1)" != "${{ steps.stage.outputs.hash }}" ]; then
            echo "::error::staged trusted script changed during the agent run — refusing to execute it."
            exit 1
          fi
          jq -c '(.nudges // [])[]' "$F" | while read -r ROW; do
            N=$(echo "$ROW" | jq -r '.number')
            echo "$ROW" | jq '{sha}' > "$RUNNER_TEMP/nudge-$N.json"
            echo "nudging PR #$N"
            bash "$STAGED" nudge "${{ github.repository }}" "$N" \
              "$RUNNER_TEMP/nudge-$N.json" \
              || echo "nudge #$N failed (non-fatal — a deleted PR or locked thread must not drop the rest)"
          done

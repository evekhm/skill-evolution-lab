# Skill Evolution dispatcher — triggered when the Quality Agent files a
# quality issue. The runner counts open quality issues; at the threshold
# (EVOLUTION_MIN_OPEN_ISSUES repo var, default 10) it dispatches the
# SDK's generic skill-evolution Cloud Run job (bqaa-skill-evolution,
# from BigQuery-Agent-Analytics-SDK deploy/skill_evolution_job/, wired
# to this lab via EVOLUTION_HOOKS), which runs the full pipeline and
# opens the PR.
#
# Auth:
#   GCP  — Workload Identity Federation (no service account keys)
#   GitHub — gh CLI uses the default GITHUB_TOKEN

name: Skill Evolution on Quality Issue

on:
  issues:
    types: [opened, labeled]

# One dispatcher at a time, globally — a batch of freshly filed issues
# queues here instead of racing N dispatchers side by side.
concurrency:
  group: evolution-dispatch
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION || 'us-central1' }}

jobs:
  evolve-skill:
    # Run on non-urgent quality issues (urgent ones go to reactive agent)
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'quality') &&
      !contains(github.event.issue.title, '[URGENT]')

    runs-on: ubuntu-latest
    permissions:
      # This job only counts/comments on issues and dispatches the Cloud
      # Run job — it never pushes or touches PRs (the evolution PR is
      # opened by the job itself with its own credential). contents:write
      # and pull-requests:write were unused grants (review #53 finding 9).
      contents: read
      issues: write
      id-token: write   # for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # The runner only counts issues and dispatches; the evolution
      # pipeline runs in the Cloud Run job (the runner has no agent
      # environment — running the pipeline here fails on imports and
      # would hit the 6h runner limit anyway).
      - name: Check threshold and dispatch the evolution job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MIN_OPEN_ISSUES: ${{ vars.EVOLUTION_MIN_OPEN_ISSUES || 10 }}
        run: |
          OPEN=$(gh issue list --label quality --state open --limit 100 --json number --jq 'length')
          echo "Open quality issues: ${OPEN} (threshold: ${MIN_OPEN_ISSUES})"
          if [ "${OPEN}" -lt "${MIN_OPEN_ISSUES}" ]; then
            echo "Below threshold — accumulating. No evolution run dispatched."
            exit 0
          fi
          # In-flight guard: one evolution run at a time. Without this,
          # every issue in a morning batch dispatches its own multi-hour
          # execution (they'd all see the same >=threshold count).
          RUNNING=$(gcloud run jobs executions list --job=bqaa-skill-evolution \
            --project="${PROJECT_ID}" --region="${REGION}" --limit=10 \
            --format="value(metadata.name,status.completionTime)" \
            | awk -F'\t' '$2=="" {c++} END {print c+0}')
          if [ "${RUNNING}" -gt 0 ]; then
            echo "An evolution execution is already running (${RUNNING} in flight) — skipping dispatch."
            exit 0
          fi
          echo "Threshold met — dispatching bqaa-skill-evolution job (async)."
          gcloud run jobs execute bqaa-skill-evolution \
            --project="${PROJECT_ID}" --region="${REGION}"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Quality-issue threshold met (${OPEN} open >= ${MIN_OPEN_ISSUES}): dispatched the bqaa-skill-evolution Cloud Run job (SDK skill-evolution job). Watch: \`gcloud run jobs executions list --job=bqaa-skill-evolution --region=${REGION}\`"

      - name: Post failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Evolution dispatch failed. See [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

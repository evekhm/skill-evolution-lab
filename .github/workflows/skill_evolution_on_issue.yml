# Skill Evolution Agent — triggered when Quality Agent creates a quality issue.
# The agent reads the issue, runs traffic + scoring against the deployed agent,
# evolves the SKILL.md, and opens a PR with "Fixes #N" to auto-close the issue.
#
# Auth:
#   GCP  — Workload Identity Federation (no service account keys)
#   GitHub — gh CLI uses the default GITHUB_TOKEN

name: Skill Evolution on Quality Issue

on:
  issues:
    types: [opened, labeled]

# Only one evolution run per issue at a time
concurrency:
  group: evolution-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION || 'us-central1' }}

jobs:
  evolve-skill:
    # Run on non-urgent quality issues (urgent ones go to reactive agent)
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'quality') &&
      !contains(github.event.issue.title, '[URGENT]')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write   # for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r agents/workflow/skill_evolution_agent/requirements.txt
          pip install python-dotenv

      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Run Skill Evolution Agent (batch mode)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GCS_UPLOAD: "true"
          GCS_BUCKET: ${{ vars.PROJECT_ID }}-skill-evolution
        run: |
          python agents/workflow/skill_evolution_agent/main.py --batch

      - name: Post failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Skill Evolution Agent run failed. See [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

# Skill Evolution dispatcher — triggered when the Quality Agent files a
# quality issue. The runner counts open quality issues; at the threshold
# (EVOLUTION_MIN_OPEN_ISSUES repo var, default 10) it dispatches the
# skill-evolution-agent Cloud Run job, which runs the full pipeline and
# opens the PR.
#
# Auth:
#   GCP  — Workload Identity Federation (no service account keys)
#   GitHub — gh CLI uses the default GITHUB_TOKEN

name: Skill Evolution on Quality Issue

on:
  issues:
    types: [opened, labeled]

# Only one evolution run per issue at a time
concurrency:
  group: evolution-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION || 'us-central1' }}

jobs:
  evolve-skill:
    # Run on non-urgent quality issues (urgent ones go to reactive agent)
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'quality') &&
      !contains(github.event.issue.title, '[URGENT]')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write   # for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # The runner only counts issues and dispatches; the evolution
      # pipeline runs in the Cloud Run job (the runner has no agent
      # environment — running the pipeline here fails on imports and
      # would hit the 6h runner limit anyway).
      - name: Check threshold and dispatch the evolution job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MIN_OPEN_ISSUES: ${{ vars.EVOLUTION_MIN_OPEN_ISSUES || 10 }}
        run: |
          OPEN=$(gh issue list --label quality --state open --limit 100 --json number --jq 'length')
          echo "Open quality issues: ${OPEN} (threshold: ${MIN_OPEN_ISSUES})"
          if [ "${OPEN}" -lt "${MIN_OPEN_ISSUES}" ]; then
            echo "Below threshold — accumulating. No evolution run dispatched."
            exit 0
          fi
          echo "Threshold met — dispatching skill-evolution-agent job (async)."
          gcloud run jobs execute skill-evolution-agent \
            --project="${PROJECT_ID}" --region="${REGION}"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Quality-issue threshold met (${OPEN} open >= ${MIN_OPEN_ISSUES}): dispatched the skill-evolution-agent Cloud Run job. Watch: \`gcloud run jobs executions list --job=skill-evolution-agent --region=${REGION}\`"

      - name: Post failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Evolution dispatch failed. See [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
